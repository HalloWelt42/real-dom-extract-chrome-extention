<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #f5f5f4;
            --bg-section: #ffffff;
            --bg-elevated: #f0eeeb;
            --border: #d6d3d1;
            --border-subtle: #e7e5e4;
            --text: #1c1917;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-glow: rgba(217, 119, 6, 0.12);
            --success: #22c55e;
            --error: #ef4444;
            --snapshot-hover: #f0eeeb;
        }

        [data-theme="dark"] {
            --bg: #2b2a27;
            --bg-section: #35342f;
            --bg-elevated: #3e3d37;
            --border: #4a4843;
            --border-subtle: #403e3a;
            --text: #ece8e1;
            --text-secondary: #b0ab9f;
            --text-muted: #8a867e;
            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-glow: rgba(217, 119, 6, 0.15);
            --success: #4ade80;
            --error: #f87171;
            --snapshot-hover: #3e3d37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            padding: 12px;
        }

        /* Icons */
        .icon {
            width: 1em;
            height: 1em;
            fill: currentColor;
            vertical-align: -0.125em;
            display: inline-block;
        }

        .icon-lg { width: 16px; height: 16px; }
        .icon-btn { width: 14px; height: 14px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .icon-spin { animation: spin 1s linear infinite; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left .icon { font-size: 16px; color: var(--accent); width: 16px; height: 16px; }
        .header-left h1 { font-size: 15px; font-weight: 600; }

        .btn-theme {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            padding: 0;
        }

        .btn-theme:hover { color: var(--accent); border-color: var(--accent); }

        .section {
            background: var(--bg-section);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .capture-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-capture {
            flex: 1;
            padding: 8px 4px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-section);
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-capture .icon { color: var(--accent); width: 16px; height: 16px; }
        .btn-capture:hover { border-color: var(--accent); background: var(--bg); }
        .btn-capture.active { border-color: var(--accent); background: var(--accent); color: #fff; }
        .btn-capture.active .icon { color: #fff; }

        select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-section);
            color: var(--text);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-item label { cursor: pointer; }

        .actions {
            display: flex;
            gap: 6px;
        }

        button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-extract {
            flex: 2;
            background: var(--accent);
            color: #fff;
        }

        .btn-extract:hover { background: var(--accent-hover); }

        .btn-copy {
            flex: 2;
            background: var(--success);
            color: #fff;
        }

        .btn-copy:hover { opacity: 0.9; }
        .btn-copy:disabled, .btn-preview:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-preview {
            flex: 1;
            background: var(--bg-section);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn-preview:hover { background: var(--bg); }

        .status {
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: none;
        }

        .status.success { background: #dcfce7; color: #166534; display: block; }
        .status.error { background: #fee2e2; color: var(--error); display: block; }
        [data-theme="dark"] .status.success { background: #14532d; color: #86efac; }
        [data-theme="dark"] .status.error { background: #450a0a; color: #fca5a5; }

        .stats {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .snapshots {
            max-height: 200px;
            overflow-y: auto;
        }

        .snapshot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .snapshot-item:last-child { border-bottom: none; }

        .snapshot-info {
            cursor: pointer;
            color: var(--accent);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .snapshot-info:hover { text-decoration: underline; }

        .snapshot-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            flex: none;
            border-radius: 3px;
        }

        .snapshot-delete:hover { color: var(--error); background: var(--snapshot-hover); }

        .input-maxchars {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-section);
            color: var(--text);
            text-align: right;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 0 2px;
        }

        .footer-links {
            display: flex;
            gap: 8px;
        }

        .footer-version {
            font-size: 11px;
            color: var(--text-muted);
        }

        .btn-donate {
            padding: 5px 10px;
            background: none;
            color: var(--error);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .btn-donate:hover { color: #fff; background: var(--error); border-color: var(--error); }

        .footer-links {
            display: flex;
            gap: 8px;
        }

        .btn-github {
            padding: 5px 10px;
            background: none;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .btn-github:hover { color: var(--text); border-color: var(--text); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <span id="headerIcon"></span>
        <h1 data-i18n="appTitle">DOM Extractor Pro</h1>
    </div>
    <div style="display: flex; gap: 6px;">
        <button class="btn-theme" id="helpBtn" data-i18n-title="helpTitle" style="color: #3b82f6;"></button>
        <button class="btn-theme" id="themeBtn" data-i18n-title="themeToggleTitle"></button>
    </div>
</div>

<div class="section">
    <div class="section-title" data-i18n="sectionCapture">Capture</div>
    <div class="capture-buttons">
        <button class="btn-capture" id="pickerBtn" data-i18n-title="capturePickerTitle">
            <span id="iconPicker"></span>
            <span data-i18n="capturePicker">Picker</span>
        </button>
        <button class="btn-capture" id="selectionBtn" data-i18n-title="captureSelectionTitle">
            <span id="iconSelection"></span>
            <span data-i18n="captureSelection">Selection</span>
        </button>
        <button class="btn-capture" id="fullDomBtn" data-i18n-title="captureFullPageTitle">
            <span id="iconFullDom"></span>
            <span data-i18n="captureFullPage">Full Page</span>
        </button>
        <button class="btn-capture" id="pageBtn" data-i18n-title="captureSmartExtractTitle">
            <span id="iconPage"></span>
            <span data-i18n="captureSmartExtract">Smart Extract</span>
        </button>
    </div>
</div>

<div class="section">
    <div class="section-title" data-i18n="sectionProfile">Profile</div>
    <div class="capture-buttons">
        <button class="btn-capture" id="profileAI" data-i18n-title="profileAITitle">
            <span id="iconProfileAI"></span>
            <span data-i18n="profileAI">AI-Optimized</span>
        </button>
        <button class="btn-capture" id="profileDev" data-i18n-title="profileDevTitle">
            <span id="iconProfileDev"></span>
            <span data-i18n="profileDev">Developer</span>
        </button>
        <button class="btn-capture" id="profileRaw" data-i18n-title="profileRawTitle">
            <span id="iconProfileRaw"></span>
            <span data-i18n="profileRaw">Minimal</span>
        </button>
        <button class="btn-capture" id="profileCustom" data-i18n-title="profileCustomTitle">
            <span id="iconProfileCustom"></span>
            <span data-i18n="profileCustom">Custom</span>
        </button>
    </div>
</div>

<div class="section">
    <div class="section-title" data-i18n="sectionFormat">Output Format</div>
    <select id="mode">
        <option value="html" data-i18n="formatHTML">Clean HTML</option>
        <option value="text" data-i18n="formatText">Plain Text</option>
        <option value="json" data-i18n="formatJSON">JSON (structured)</option>
        <option value="markdown" data-i18n="formatMarkdown">Markdown</option>
    </select>

    <div class="section-title" style="margin-top: 8px;" data-i18n="sectionFilter">Filters</div>
    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="removeJS" checked>
            <label for="removeJS" data-i18n="filterJS">Remove JS</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeCSS" checked>
            <label for="removeCSS" data-i18n="filterCSS">Remove CSS</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeSVG" checked>
            <label for="removeSVG" data-i18n="filterSVG">Remove SVG</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeImages">
            <label for="removeImages" data-i18n="filterImages">Remove images</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeDataAttrs" checked>
            <label for="removeDataAttrs" data-i18n="filterDataAttrs">Data attributes</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeEmptyTags" checked>
            <label for="removeEmptyTags" data-i18n="filterEmptyTags">Empty tags</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeNavLinks" checked>
            <label for="removeNavLinks" data-i18n="filterNavLinks">Nav links</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeForms" checked>
            <label for="removeForms" data-i18n="filterForms">Forms</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="flattenDivs" checked>
            <label for="flattenDivs" data-i18n="filterFlattenDivs">Flatten containers</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="removeDuplicates">
            <label for="removeDuplicates" data-i18n="filterDuplicates">Duplicate text</label>
        </div>
        <div class="checkbox-item" style="grid-column: span 2;">
            <input type="checkbox" id="normalizeSpaces" checked>
            <label for="normalizeSpaces" data-i18n="filterWhitespace">Normalize whitespace</label>
        </div>
    </div>

    <div class="section-title" style="margin-top: 8px;" data-i18n="sectionMaxChars">Max. Characters</div>
    <input type="text" id="maxChars" value="100.000.000" class="input-maxchars">
</div>

<div class="section">
    <div class="actions">
        <button class="btn-extract" id="extractBtn"></button>
        <button class="btn-copy" id="copyBtn" disabled></button>
        <button class="btn-preview" id="previewBtn" disabled data-i18n-title="btnPreviewTitle"></button>
    </div>
    <div id="status" class="status"></div>
    <div id="stats" class="stats"></div>
</div>

<div class="section" id="snapshotsSection" style="display: none;">
    <div class="section-title" data-i18n="sectionSnapshots">Snapshots</div>
    <div class="snapshots" id="snapshots"></div>
</div>

<div class="footer">
    <span class="footer-version" id="footerCopyright"></span>
    <div class="footer-links">
        <a class="btn-github" id="githubBtn" href="#" title="GitHub">
            <span id="iconGithub"></span> GitHub
        </a>
        <a class="btn-donate" id="donateBtn" href="#" data-i18n-title="donateLabel">
            <span id="iconDonate"></span> <span data-i18n="donateLabel">Say thanks</span>
        </a>
    </div>
</div>

<script src="shared/i18n.js"></script>
<script src="icons.js"></script>
<script src="popup.js"></script>

</body>
</html>
